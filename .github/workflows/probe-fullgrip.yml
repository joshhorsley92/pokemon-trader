# Throwaway diagnostic workflow: probe Full Grip from a GitHub datacenter IP
# under several header configs to see why the nightly crawl stalls there.
# Delete once the Full Grip fix is settled.
name: Probe Full Grip

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-fullgrip.mjs
