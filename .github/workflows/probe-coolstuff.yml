# Throwaway diagnostic: probe CoolStuff from a GitHub datacenter IP to see why
# the nightly crawl fails there. Delete once the CoolStuff question is settled.
name: Probe CoolStuff

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-coolstuff.mjs
