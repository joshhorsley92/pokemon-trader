name: Daily TCGCSV price sync

on:
  schedule:
    # TCGCSV publishes daily around 20:00 UTC; run 90 minutes later
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-sync (ignore modifiedOn deltas)"
        type: boolean
        default: false

concurrency:
  group: tcgcsv-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Generous for the first-ever MTG backfill (hundreds of new sets); routine
    # daily runs finish in a few minutes thanks to modifiedOn delta-skipping.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is regenerated in a linux container (see README) so it
      # carries linux-only optional deps (esbuild, @emnapi/*) and `npm ci`
      # resolves cleanly on ubuntu runners. The fallback keeps the cron alive
      # if a Windows `npm install` ever re-prunes those platform deps from the
      # lockfile — install repairs it on the runner rather than failing the job.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Run sync
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx tsx scripts/sync-tcgcsv.ts ${{ inputs.full && '--full' || '' }}
      # After the catalog refresh so new sets/products are matchable.
      # Vendor failures exit non-zero but don't block each other.
      - name: Sync vendor buylists
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx tsx scripts/sync-buylists.ts
      # Real per-condition prices. Warming in bulk belongs here rather than on
      # the request path: a run larger than one rate-limit window has to wait
      # out the window between bursts, which no serverless function will
      # tolerate. The app still tops up on demand (CONDITION_MAX_CARDS) — that
      # path is sized to a single window, so it returns in seconds.
      # The script exits 0 when no key is configured, so this stays green.
      - name: Sync per-condition prices
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
        run: npx tsx scripts/sync-condition-prices.ts --limit 400 --min-value 10
        continue-on-error: true
